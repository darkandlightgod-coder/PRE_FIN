name: 📊 Daily AI Financial Prediction Pipeline

on:
  schedule:
    # 每天台灣時間下午 5:00 (UTC 09:00) 自動執行 (僅限週一到週五)
    # 若需更改時間，請調整 '0 9' (分 時，UTC 時間)
    - cron: '0 9 * * 1-5'
  
  # 允許您在 GitHub 網頁上手動點擊 "Run workflow" 隨時測試
  workflow_dispatch: 

jobs:
  run-prediction-pipeline:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虛擬機

    steps:
    - name: 📥 1. 取得最新程式碼 (Checkout)
      uses: actions/checkout@v4

    - name: 🐍 2. 設定 Python 3.10 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 3. 安裝系統依賴套件 (Dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn yfinance gspread google-auth google-api-python-client requests matplotlib

    # -------------------------------------------------------------
    # 🚀 依序執行四個核心模組，一步步建立 Data Lake 並進行預測
    # -------------------------------------------------------------
    
    - name: 🌍 步驟 A：執行全球宏觀因子擷取 (GLOBAL Market Factors)
      env:
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: python GLOBAL_Market_Factors.py

    - name: 📈 步驟 B：執行台灣現貨與特定指數擷取
      env:
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: python specific_web_index_and_all_number_data_grab.py

    - name: 📰 步驟 C：執行新聞輿情與 AI 語意分析計分
      env:
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: python web_grab_and_language_AI_score_for_PCA.py

    - name: 🧠 步驟 D：執行 PCA 降維與 Ridge 大盤預測大腦
      env:
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: python PCA_TWII.py

    # 💡 備註：如果您傾向只跑五合一整合版，請「刪除/註解」上面的步驟 A~D，
    # 並「取消註解」下方這行：
    # - name: 🚀 執行五合一整合主控程式
    #   env:
    #     GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
    #   run: python pca_master.py
