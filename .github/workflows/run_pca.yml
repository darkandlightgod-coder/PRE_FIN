name: 🚀 Financial Analysis Pipeline

on:
  workflow_dispatch: # 手動觸發
  schedule:
    - cron: '0 9 * * *' # 每天早上 9 點自動執行 (UTC 時間)

jobs:
  # 統一安裝環境與快取
  setup-env:
    runs-on: ubuntu-latest
    outputs:
      python-version: '3.10'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 🚀 解決方案：使用 --user 參數安裝，避開 Debian/Ubuntu 系統寫入限制
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user -r requirements.txt

  # 爬蟲工作 (並行執行多個腳本)
  crawler:
    needs: setup-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script:
          - specific_web_index_and_all_number_data_grab.py
          - GLOBAL_Market_Factors.py
          - web_grab_and_language_AI_score_for_PCA.py
          - 13_single_stock_grab.py
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      - name: ♻️ Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user -r requirements.txt

      - name: 🚀 Run Crawler Script
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python ${{ matrix.script }}

  # 分析工作 (大腦預測)
  analysis:
    needs: crawler
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      - name: ♻️ Restore pip cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user -r requirements.txt

      - name: 📊 Run PLS Engine (V14.6)
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python PCA_TWII.py

  # 🛡️ 保持活躍任務 (避免 GitHub Actions 60 天自動停用)
  keepalive-job:
    needs: analysis     # 確保在最後一個分析任務之後才執行
    runs-on: ubuntu-latest
    if: always()        # 無論前面的任務成功、失敗或取消，都強制執行此保活動作
    permissions:
      contents: write   # 給予寫入權限，以便 Keepalive Action 更新狀態
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🛡️ Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2
