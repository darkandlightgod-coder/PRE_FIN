name: V10.0 Oracle Matrix Pipeline

on:
  schedule:
    - cron: '0 10 * * 1-5' # 每週一到五 UTC 10:00 執行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests scikit-learn gspread google-auth playwright
        playwright install chromium

    - name: Execute Oracle Matrix Master
      env:
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: |
        python pca_master_exceed_v10.py
