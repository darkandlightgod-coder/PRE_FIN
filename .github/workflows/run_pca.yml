name: Web Scraping, AI Scoring, and PCA Analysis Pipeline

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每天凌晨 00:00 (UTC) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允許在 GitHub 介面上手動觸發執行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn matplotlib seaborn requests gspread google-auth google-api-python-client

      - name: 執行資料處理與分析管線
        env:
          # 🔗 將 GitHub Secrets 橋接至執行環境變數
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 🎯 執行您指定檔名的主控分析流程
          python web_grab_and_language_AI_score_for_PCA.py
