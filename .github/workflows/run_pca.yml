name: 🚀 Financial Analysis Pipeline

on:
  workflow_dispatch: # 手動觸發
  schedule:
    - cron: '0 9 * * *' # 每天早上 9 點自動執行 (UTC 時間)

jobs:
  # 統一安裝環境與快取
  setup-env:
    runs-on: ubuntu-latest
    outputs:
      python-version: '3.10'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🚀 優化點：直接用 pip 安裝 uv，再讓 uv 接手極速安裝套件
      - name: 📦 Install Dependencies (Using uv)
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

  # 爬蟲工作 (並行執行多個腳本)
  crawler:
    needs: setup-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script:
          - specific_web_index_and_all_number_data_grab.py
          - GLOBAL_Market_Factors.py
          - web_grab_and_language_AI_score_for_PCA.py
          - 13_single_stock_grab.py
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      - name: 📦 Install Dependencies (Using uv)
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: 🚀 Run Crawler Script
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python ${{ matrix.script }}

  # 分析工作 (大腦 PCA_TWII.py)
  analysis:
    needs: crawler
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      - name: 📦 Install Dependencies (Using uv)
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: 📊 Run PCA and Prediction (V14.5 極速版)
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python PCA_TWII.py
