name: PCA TWII Daily Pipeline

on:
  schedule:
    # 每天台灣時間早上 09:00 執行 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允許手動觸發測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn gspread google-auth google-api-python-client requests matplotlib

      - name: Run Five-in-One Pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python web_grab_and_language_AI_score_for_PCA.py
