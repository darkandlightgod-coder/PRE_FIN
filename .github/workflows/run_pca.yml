name: 🚀 Financial Analysis Pipeline

on:
  workflow_dispatch: # 手動觸發
  schedule:
    - cron: '0 9 * * *' # 每天早上 9 點自動執行 (UTC 時間)

jobs:
  # 統一安裝環境與快取
  setup-env:
    runs-on: ubuntu-latest
    outputs:
      python-version: '3.10'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ==========================================
      # 🚀 優化點 1：導入極速安裝工具 uv
      # ==========================================
      - name: ⚡ Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 📦 Install Dependencies (Using uv)
        run: |
          $HOME/.cargo/bin/uv pip install --system -r requirements.txt

  # 爬蟲工作 (並行執行多個腳本)
  crawler:
    needs: setup-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script:
          - specific_web_index_and_all_number_data_grab.py
          - GLOBAL_Market_Factors.py
          - web_grab_and_language_AI_score_for_PCA.py
          - 13_single_stock_grab.py
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      # ==========================================
      # 🚀 優化點 2：每個爬蟲虛擬機也使用 uv 極速安裝
      # ==========================================
      - name: ⚡ Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 📦 Install Dependencies (Using uv)
        run: |
          $HOME/.cargo/bin/uv pip install --system -r requirements.txt

      - name: 🚀 Run Crawler Script
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python ${{ matrix.script }}

  # 分析工作 (大腦 PCA_TWII.py)
  analysis:
    needs: crawler
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup-env.outputs.python-version }}

      # ==========================================
      # 🚀 優化點 3：主分析機也使用 uv 極速安裝
      # ==========================================
      - name: ⚡ Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 📦 Install Dependencies (Using uv)
        run: |
          $HOME/.cargo/bin/uv pip install --system -r requirements.txt

      - name: 📊 Run PCA and Prediction (V14.5 極速版)
        env:
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
        run: python PCA_TWII.py
