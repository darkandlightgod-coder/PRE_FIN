name: Run PCA Prediction Pipeline

on:
  schedule:
    # 台北時間週一至週五，每天晚上 18:30 自動執行 (對應 UTC 時間 10:30)
    - cron: '30 10 * * 1-5'
  
  # 支援在 GitHub 網頁一鍵手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出倉庫代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝必要套件
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance beautifulsoup4 requests snownlp vaderSentiment tabulate matplotlib nest_asyncio urllib3 playwright gspread google-auth google-api-python-client

      # 4. 安裝 Playwright 瀏覽器核心 (用於爬蟲)
      - name: Install Playwright Chromium with Deps
        run: |
          playwright install --with-deps chromium

      # 5. 自適應目錄結構修復工程 (核心安全防護)
      - name: Structure Autocure & File Migration
        run: |
          echo "🛠️ 啟動自適應目錄結構修復..."
          
          # 檢查是否有 Python 腳本被誤放到 .github/workflows/ 中
          誤放腳本=$(find .github/workflows/ -maxdepth 1 -name "*.py")
          
          if [ ! -z "$誤放腳本" ]; then
            echo "⚠️ 偵測到有 Python 腳本被放置在安全管制區 (.github/workflows/) 內！"
            echo "🚀 正在將腳本自動安全移往『最外層根目錄』以符合安全規範..."
            mv .github/workflows/*.py ./
          fi
          
          # 清除可能產生在管制區底下的 data 快取，防止被 GitHub Security 阻擋
          if [ -d ".github/workflows/data" ]; then
            echo "🧹 清除管制區殘留之舊 data 快取目錄..."
            rm -rf .github/workflows/data
          fi
          
          echo "📁 目前最外層根目錄結構為："
          ls -la

      # 6. 執行自動化預測流水線 (在根目錄安全執行)
      - name: Execute PCA Prediction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🚀 步驟 1/4: 開始抓取台股選擇權與三大法人數據..."
          python specific_web_index_and_all_number_data_grab.py < /dev/null
          
          echo "🚀 步驟 2/4: 開始採集焦點財經新聞並進行 AI 情緒分析解構..."
          python web_grab_and_language_AI_score_for_PCA.py < /dev/null
          
          echo "🚀 步驟 3/4: 開始抓取全球多維度關鍵市場特徵指標..."
          python GLOBAL_Market_Factors.py < /dev/null
          
          echo "🚀 步驟 4/4: 啟動 PCA 降維與 Ridge 脊迴歸模型，並進行嚴格雲端讀寫校驗..."
          python PCA_TWII.py < /dev/null

      # 7. 自動將更新同步回 GitHub 倉庫 (此時 data/ 將留在根目錄，避開安全阻擋)
      - name: Commit and Push Updated Databases & Predictions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # 如果有被移到根目錄的 .py 檔案，一起納入追蹤
          git add *.py
          
          # 強制清除對 .github/workflows/data 資料夾的 git 暫存追蹤
          git rm -r --cached .github/workflows/data 2>/dev/null || true
          
          # 追蹤外層的資料庫更新
          git add data/
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: sync historical databases to root /data/ and next-day PCA predictions"
            git push origin main
            echo "✅ 成功將最新的歷史資料與預測結果同步推回 GitHub 倉庫！"
          else
            echo "ℹ️ 資料庫內容無任何變動，跳過提交。"
          fi
