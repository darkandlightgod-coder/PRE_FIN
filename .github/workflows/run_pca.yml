name: Run PCA Prediction Pipeline

on:
  schedule:
    # 台北時間週一至週五，每天晚上 18:30 自動執行 (對應 UTC 時間 10:30)
    - cron: '30 10 * * 1-5'
  
  # 支援在 GitHub 網頁一鍵手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出倉庫代碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安裝必要套件 (包含 Google 雲端 API 系列套件)
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance beautifulsoup4 requests snownlp vaderSentiment tabulate matplotlib nest_asyncio urllib3 playwright gspread google-auth google-api-python-client

      # 4. 安裝 Playwright 瀏覽器核心 (用於爬蟲)
      - name: Install Playwright Chromium with Deps
        run: |
          playwright install --with-deps chromium

      # 5. 執行自動化預測流水線 (串接 GitHub Secrets 變數)
      - name: Execute PCA Prediction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "🔍 正在搜尋腳本所在的目標資料夾..."
          TARGET_FILE="specific_web_index_and_all_number_data_grab.py"
          SCRIPT_PATH=$(find . -name "$TARGET_FILE" | head -n 1)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ [ERROR] 在 GitHub 倉庫中找不到關鍵腳本: $TARGET_FILE"
            echo "📁 目前 GitHub 虛擬機中的檔案結構清單如下："
            find . -maxdepth 4 -not -path '*/.*' -not -path './node_modules*'
            exit 1
          fi
          
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          echo "🎯 成功尋找到腳本目錄：$SCRIPT_DIR"
          cd "$SCRIPT_DIR"
          
          echo "🚀 步驟 1/4: 開始抓取台股選擇權與三大法人數據..."
          python specific_web_index_and_all_number_data_grab.py < /dev/null
          
          echo "🚀 步驟 2/4: 開始採集焦點財經新聞並進行 AI 情緒分析解構..."
          python web_grab_and_language_AI_score_for_PCA.py < /dev/null
          
          echo "🚀 步驟 3/4: 開始抓取全球多維度關鍵市場特徵指標..."
          python GLOBAL_Market_Factors.py < /dev/null
          
          echo "🚀 步驟 4/4: 啟動 PCA 降維與 Ridge 脊迴歸模型，並進行嚴格雲端讀寫校驗..."
          python PCA_TWII.py < /dev/null

      # 6. 自動同步回 GitHub 倉庫 (本地保險備份)
      - name: Commit and Push Updated Databases & Predictions
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Automated update: sync historical databases and next-day PCA predictions with cloud verification"
            git push
            echo "✅ 成功將最新的歷史資料與預測結果同步推回 GitHub 倉庫！"
          else
            echo "ℹ️ 資料庫內容無任何變動，跳過提交。"
          fi
