name: 🚀 Financial Analysis Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天固定時間執行

jobs:
  # --- 並行執行區 (爬蟲任務) ---
  crawler-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Run Crawler 1
        env: {GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}}
        run: python specific_web_index_and_all_number_data_grab.py

  crawler-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Run Crawler 2
        env: {GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}}
        run: python GLOBAL_Market_Factors.py

  crawler-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Run Crawler 3
        env: {GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}}
        run: python web_grab_and_language_AI_score_for_PCA.py

  crawler-4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Run Crawler 4
        env: {GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}}
        run: python 13_single_stock_grab.py

  # --- 相依執行區 (分析任務) ---
  analysis:
    needs: [crawler-1, crawler-2, crawler-3, crawler-4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: Install Analysis Deps
        run: pip install pandas numpy sklearn xgboost gspread google-auth
      - name: Run Prediction Analysis
        env: {GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}}
        run: python PCA_TWII.py
