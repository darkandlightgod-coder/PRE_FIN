name: PCA TWII Daily Pipeline

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 01:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn gspread google-auth google-api-python-client requests matplotlib yfinance

      - name: Run Master Pipeline
        env:
          # 修正重點：確保變數名與 Secret 設定完全對應
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSPREAD_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python test_google_connection.py
