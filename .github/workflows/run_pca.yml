name: 🧪 Test Specific Stock Grabber

on:
  workflow_dispatch: # 允許在 GitHub Actions 頁面手動點擊 "Run workflow" 觸發

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository (取得程式碼與 CSV)
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install Required Packages (安裝必要套件)
      # 雖然您的 Python 腳本內有自癒安裝功能，
      # 但在 GitHub Actions 中預先安裝可以大幅加快執行速度並避免 Timeout。
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance gspread google-auth

    - name: 🚀 Run Specific Stock Data Grabber (執行個股與籌碼爬蟲)
      env:
        # 將 GitHub Secrets 傳遞給 Python 環境變數
        GSPREAD_CREDENTIALS: ${{ secrets.GSPREAD_CREDENTIALS }}
      run: |
        python web_grab_and_language_AI_score_for_PCA.py
